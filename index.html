<style>
/* Layout: one slide at a time inside a scrolling stage; sticky header strip above, prev/next + segment progress below. Tap targets reveal detail in place. */
:root {
  --bg: #EDF2EE;
  --surface: #FFFFFF;
  --fg: #13231F;
  --muted: #4B5F58;
  --line: #C5D3CC;
  --accent: #0B6E5F;
  --accent-fg: #FFFFFF;
  --accent-soft: #D6EBE4;
  --hi: #E8A900;
  --hi-soft: #FBEEBF;
  --hi-fg: #4A3500;
  --font-display: 'Noto Serif Tamil', 'Latha', 'Nirmala UI', serif;
  --font-body: 'Noto Sans Tamil', 'Latha', 'Nirmala UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1715; --surface: #14241F; --fg: #E5F0EB; --muted: #9DB4AC; --line: #2B403A;
    --accent: #4FC3AA; --accent-fg: #06241D; --accent-soft: #17352E;
    --hi: #F2C230; --hi-soft: #3A3210; --hi-fg: #F7E3A0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1715; --surface: #14241F; --fg: #E5F0EB; --muted: #9DB4AC; --line: #2B403A;
  --accent: #4FC3AA; --accent-fg: #06241D; --accent-soft: #17352E;
  --hi: #F2C230; --hi-soft: #3A3210; --hi-fg: #F7E3A0;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--hi); outline-offset: 2px; }

#app { height: 100%; display: flex; flex-direction: column; max-width: 980px; margin: 0 auto; }
.top {
  display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding-block: 10px 8px; border-bottom: 1px solid var(--line);
  font-size: 13px; color: var(--muted);
}
.top b { color: var(--accent); font-weight: 700; }
.top .count { font-family: var(--font-mono); font-size: 13px; white-space: nowrap; }

#stage { flex: 1; min-height: 0; overflow-y: auto; padding-block: 18px 20px; }
#stage > .slide { padding-bottom: 38vh; }
.slide { animation: in .35s ease both; }
@keyframes in { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
.slide.back { animation-name: inback; }
@keyframes inback { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .slide, .slide.back { animation: none; } * { transition: none !important; } }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.4; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(26px, 6.4vw, 44px); font-weight: 800; }
h2 { font-size: clamp(22px, 5vw, 32px); font-weight: 800; }
h3 { font-size: 17px; font-weight: 600; }
p { margin: 0; max-width: 65ch; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.hint { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.hint::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--hi); flex: none; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.stack-s { display: flex; flex-direction: column; gap: 8px; }

/* title slide */
.cover { display: flex; flex-direction: column; gap: 20px; }
.cover .def { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 16px 18px; }
.cover .def em { font-style: normal; font-weight: 700; color: var(--accent); }
.reveal-btn {
  align-self: flex-start; display: inline-flex; align-items: center; gap: 10px;
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 999px;
  padding: 10px 18px; font-weight: 700;
}
.reveal-btn .pm { font-family: var(--font-mono); font-size: 18px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--accent); color: var(--accent); background: transparent;
  border-radius: 999px; padding: 4px 14px; font-size: 15px; font-weight: 500;
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chip.static { cursor: default; background: var(--accent-soft); border-color: transparent; color: var(--fg); }

/* overview */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile {
  text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; min-width: 0;
  transition: border-color .15s, transform .15s;
}
.tile:hover { border-color: var(--accent); transform: translateY(-2px); }
.tile .n { font-family: var(--font-mono); font-size: 20px; color: var(--accent); line-height: 1.5; }
.tile .t { font-weight: 500; line-height: 1.5; min-width: 0; }
.tile .e { display: block; font-size: 12px; color: var(--muted); font-family: var(--font-mono); margin-top: 2px; }

/* method slide */
.mhead { display: flex; gap: 14px; align-items: flex-start; }
.mhead .big { font-family: var(--font-mono); font-size: clamp(40px, 10vw, 64px); line-height: 1; color: var(--accent); }
.mhead .eng { font-family: var(--font-mono); font-size: 13px; color: var(--muted); margin-top: 4px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.card > button.card-head {
  width: 100%; text-align: left; background: none; border: 0; padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  font-weight: 700; color: var(--accent);
}
.card .body { padding: 0 16px 16px; }
.pm { font-family: var(--font-mono); font-size: 20px; line-height: 1; flex: none; }
.cols { display: grid; grid-template-columns: 1fr; gap: 18px; align-items: start; }
@media (min-width: 760px) { .cols { grid-template-columns: 1fr 1fr; } }
.skills { display: flex; flex-direction: column; gap: 8px; }
.skill { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.skill.open { border-color: var(--accent); }
.skill > button {
  width: 100%; text-align: left; background: none; border: 0; padding: 10px 14px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700;
}
.skill > button .pm { color: var(--accent); }
.skill .desc { padding: 0 14px 12px; background: var(--accent-soft); padding-top: 10px; }
.skill.plain > div.plain-row { padding: 10px 14px; font-weight: 700; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.link-btn { background: none; border: 0; color: var(--accent); font-weight: 700; padding: 4px 0; text-decoration: underline; text-underline-offset: 3px; }

/* summary */
.rows { display: flex; flex-direction: column; gap: 8px; }
.srow {
  text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px;
  transition: opacity .2s, border-color .2s, background .2s;
}
@media (min-width: 760px) { .srow { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 18px; align-items: center; } }
.srow .m { font-weight: 700; }
.srow .s { color: var(--muted); font-size: 15px; }
.srow.on { border-color: var(--hi); background: var(--hi-soft); color: var(--hi-fg); }
.srow.on .s { color: var(--hi-fg); }
.srow.dim { opacity: .35; }
.srow .go { font-family: var(--font-mono); color: var(--accent); margin-right: 6px; }

/* cycle */
.steps { display: flex; flex-direction: column; position: relative; }
.step { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; }
.step .rail { display: flex; flex-direction: column; align-items: center; }
.step .dot {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent);
  display: grid; place-items: center; font-family: var(--font-mono); background: var(--bg); flex: none;
}
.step.open .dot { background: var(--accent); color: var(--accent-fg); }
.step .line { flex: 1; width: 2px; background: var(--line); margin-block: 2px; }
.step:last-child .line { display: none; }
.step .main { padding-bottom: 14px; min-width: 0; }
.step > .main > button {
  width: 100%; text-align: left; background: none; border: 0; padding: 4px 0 6px; font-weight: 700;
  display: flex; justify-content: space-between; gap: 10px; align-items: flex-start;
}
.step .detail { background: var(--accent-soft); border-radius: 6px; padding: 10px 14px; }

/* teacher */
.seg { display: inline-flex; border: 1px solid var(--accent); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
.seg button { background: transparent; border: 0; padding: 8px 16px; font-weight: 700; color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chain { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; counter-reset: c; }
.chain div { background: var(--surface); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 12px; font-weight: 500; }
.chain div::before { counter-increment: c; content: counter(c); display: block; font-family: var(--font-mono); color: var(--accent); }
.single { background: var(--surface); border: 1px dashed var(--muted); border-radius: 6px; padding: 14px 16px; }
.opps { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.opps div { background: var(--hi-soft); color: var(--hi-fg); border-radius: 6px; padding: 10px 14px; font-weight: 500; }

/* conclusion */
.quals { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.qual { background: var(--accent); color: var(--accent-fg); border-radius: 6px; padding: 14px 16px; font-family: var(--font-display); font-weight: 600; line-height: 1.5; }

/* footer nav */
.bottom { padding-block: 8px 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.segs { display: flex; gap: 3px; }
.segs button { flex: 1; height: 22px; background: none; border: 0; padding: 8px 0; min-width: 0; }
.segs button i { display: block; height: 6px; border-radius: 3px; background: var(--line); }
.segs button.done i { background: var(--accent); opacity: .45; }
.segs button.cur i { background: var(--accent); opacity: 1; }
.navrow { display: flex; justify-content: space-between; gap: 10px; }
.nav {
  flex: 1; max-width: 220px; border-radius: 999px; padding: 10px 18px; font-weight: 700;
  border: 2px solid var(--accent); background: transparent; color: var(--accent);
}
.nav.next { background: var(--accent); color: var(--accent-fg); }
.nav:disabled { opacity: .3; cursor: default; }
</style>

      el('p', { text: 'மெய்ம்மைக் கற்றல் முறைகள் திறன்களை வளர்ப்பதில் பின்வரும் கற்றல் சுழற்சி முக்கியமானது.' }),
      el('p', { class: 'hint', text: 'ஒரு படியைத் தொட்டு, அங்கு வளரும் திறன்களைப் பார்க்கவும்.' }),
      steps
    ]);
  });

  /* 12 — teacher note */
  slides.push(function () {
    var mode = 'student';
    var out = el('div');
    var bT = el('button', { type: 'button', 'aria-pressed': 'false', text: 'ஆசிரியர் தயாரித்தால்' });
    var bS = el('button', { type: 'button', 'aria-pressed': 'true', text: 'மாணவர்கள் தயாரித்தால்' });
    function draw() {
      bT.setAttribute('aria-pressed', String(mode === 'teacher'));
      bS.setAttribute('aria-pressed', String(mode === 'student'));
      out.textContent = '';
      if (mode === 'teacher') {
        out.appendChild(el('div', { class: 'single' }, [el('p', { text: 'சுவரொட்டியை ஆசிரியரே தயாரித்து மாணவர்களிடம் காட்டுதல்.' })]));
      } else {
        out.appendChild(el('div', { class: 'chain' }, ['மாணவர்களே பிரச்சினையைத் தெரிவுசெய்தல்','தகவல்களைச் சேகரித்தல்','குழுவாகச் சுவரொட்டியை உருவாக்குதல்','சமூகத்திடம் விளக்குவதற்கு ஏற்பாடு செய்தல்'].map(function (t) { return el('div', { text: t }); })));
        out.appendChild(el('p', { style: 'margin-top:10px;font-weight:700;color:var(--accent)', text: 'இதுவே அதிக பயனளிக்கும்.' }));
      }
    }
    bT.addEventListener('click', function () { mode = 'teacher'; draw(); center(out); });
    bS.addEventListener('click', function () { mode = 'student'; draw(); center(out); });
    draw();
    return el('section', { class: 'stack' }, [
      el('span', { class: 'eyebrow', text: 'ஆசிரியருக்கு' }),
      el('h2', { text: 'ஆசிரியர் கவனிக்க வேண்டிய முக்கிய அம்சம்' }),
      el('p', { text: 'இந்தக் கற்றல் முறைகளைப் பயன்படுத்துவது மட்டுமே 21ஆம் நூற்றாண்டுத் திறன்களை உறுதியாக வளர்த்துவிடாது. ஒவ்வொரு செயற்பாட்டிலும் மாணவர்களுக்கு இந்த வாய்ப்புகளை வழங்க வேண்டும்:' }),
      el('div', { class: 'opps' }, ['சுயமாகச் சிந்திக்க','தீர்மானங்களை எடுக்க','குழுவாகப் பணியாற்ற','தமது கற்றலை மதிப்பிட'].map(function (t) { return el('div', { text: t }); })),
      el('h3', { text: 'உதாரணம்: சுவரொட்டி' }),
      el('p', { class: 'hint', text: 'இரண்டு நிலைகளையும் தொட்டு ஒப்பிடவும்.' }),
      el('div', { class: 'seg', role: 'group' }, [bT, bS]),
      out
    ]);
  });

  /* 13 — conclusion */
  slides.push(function () {
    return el('section', { class: 'stack' }, [
      el('span', { class: 'eyebrow', text: 'முடிவாக' }),
      el('h2', { text: 'குடியுரிமைக்கல்வியில் மெய்ம்மைக் கற்றல் முறைகள் அறிவைப் பெறுவதற்கான வழிமுறைகள் மட்டுமல்ல.' }),
      el('p', { text: 'அவை மாணவர்களை 21ஆம் நூற்றாண்டுப் பிரசைகளாக உருவாக்க உதவும் கற்பித்தல் அணுகுமுறைகளாகும்:' }),
      el('div', { class: 'quals' }, ['சிந்திக்கக்கூடிய','பொறுப்புணர்வுள்ள','ஜனநாயக விழுமியங்களை மதிக்கின்ற','சமூகப் பிரச்சினைகளுக்குத் தீர்வுகளை முன்வைக்கக்கூடிய'].map(function (t) { return el('div', { class: 'qual', text: t }); })),
      el('button', { class: 'reveal-btn', type: 'button', onclick: function () { go(0); } }, [el('span', { text: 'மீண்டும் தொடங்கு' }), el('span', { class: 'pm', text: '↺' })])
    ]);
  });

  var TOTAL = slides.length;
  var sections = ['அறிமுகம்','முறைகள்','முறை 1','முறை 2','முறை 3','முறை 4','முறை 5','முறை 6','முறை 7','முறை 8','சுருக்கம்','சுழற்சி','ஆசிரியருக்கு','முடிவு'];

  var segBtns = [];
  for (var k = 0; k < TOTAL; k++) {
    (function (k) {
      var b = el('button', { type: 'button', 'aria-label': 'ஸ்லைடு ' + (k + 1) + ': ' + sections[k] }, [el('i')]);
      b.addEventListener('click', function () { go(k); });
      segsEl.appendChild(b); segBtns.push(b);
    })(k);
  }

  function go(n, silent) {
    if (n < 0 || n >= TOTAL) return;
    var back = n < cur;
    cur = n;
    stage.textContent = '';
    var node = slides[n]();
    node.classList.add('slide'); if (back) node.classList.add('back');
    stage.appendChild(node);
    stage.scrollTop = 0;
    countEl.textContent = (n + 1) + ' / ' + TOTAL;
    prevBtn.disabled = n === 0; nextBtn.disabled = n === TOTAL - 1;
    segBtns.forEach(function (b, i) { b.className = i < n ? 'done' : (i === n ? 'cur' : ''); if (i === n) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
    try { history.replaceState(null, '', '#s-' + (n + 1)); } catch (e) {}
  }

  prevBtn.addEventListener('click', function () { go(cur - 1); });
  nextBtn.addEventListener('click', function () { go(cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') go(cur + 1);
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(cur - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(TOTAL - 1);
  });

  var sx = 0, sy = 0;
  stage.addEventListener('touchstart', function (e) { var t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(dx < 0 ? cur + 1 : cur - 1);
  }, { passive: true });

  var start = 0;
  var m = /^#s-(\d+)$/.exec(location.hash || '');
  if (m) { var v = parseInt(m[1], 10) - 1; if (v >= 0 && v < TOTAL) start = v; }
  go(start);
  window.addEventListener('hashchange', function () {
    var mm = /^#s-(\d+)$/.exec(location.hash || '');
    if (mm) { var v2 = parseInt(mm[1], 10) - 1; if (v2 >= 0 && v2 < TOTAL && v2 !== cur) go(v2); }
  });
})();
</script>

</body></html>
